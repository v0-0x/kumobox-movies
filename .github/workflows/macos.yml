# Builds, tests and packages Moviko (movies and TV shows) for macOS on a real
# Mac, then publishes the disk image and the zip of the app as the GitHub
# Release "Moviko <version> for macOS", tagged macos-v<version> on the commit
# it built.
#
# The app is universal: one download for Apple silicon and Intel Macs. The
# server is built for both (dist/macos/moviko-arm64 and moviko-x64) and
# electron-builder merges them into the app's one program
# (desktop/electron-builder.yml).
#
# The version is 2.0.<commits since 2.0.0's>, like the Windows release's (see
# windows.yml): installed copies look for the macos-v release with the
# highest version and offer it on the Home page (server/internal/update),
# which downloads the zip.
#
# Builds, tests, packages and starts the app on every push to any branch and
# for pull requests (except changes to docs or to the other systems'
# packaging only), and keeps the disk image and the zip as workflow
# artifacts: a branch can be tried on a Mac before it's merged. Only pushes
# to the repository's default branch publish a release (and delete old
# ones); run by hand from the Actions tab, "publish" decides. Each release
# is a beta (a pre-release, "Moviko <version> beta for macOS") unless the
# pushed commit's message says [stable] or it's run by hand as stable (see
# windows.yml). The newest 10 stable releases and the newest 10 betas are
# kept: older ones are deleted, tags included.
#
# The app isn't signed with an Apple Developer ID nor notarized: it's signed
# ad hoc, and the release notes say how to open it the first time.

name: macOS release

on:
  # Branches only: the tags the releases create don't start it again.
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "packaging/arch/**"
      - "packaging/windows/**"
      - "android/**"
      - "packaging/android/**"
  # Pull requests from forks: a branch of this repository is built by its
  # pushes already (see the jobs' condition).
  pull_request:
    paths-ignore:
      - "**.md"
      - "packaging/arch/**"
      - "packaging/windows/**"
      - "android/**"
      - "packaging/android/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the GitHub Release macos-v<version> (otherwise it's only kept as workflow artifacts)
        type: boolean
        default: true
      channel:
        description: "beta: a pre-release, offered to copies with Beta updates on; stable: a release for everyone"
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

# A newer push to a branch or a pull request cancels the run still going on
# it; on the default branch every run finishes, as each publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  macos:
    name: Build, test and package (macOS universal)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
      # "true" when this run publishes the release: a push to the default
      # branch, or a run by hand with "publish" ticked.
      PUBLISH: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      # The whole history: the version counts its commits.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The token stays out of .git/config, where the build's
          # dependencies (npm scripts…) could read it: only the release
          # steps get it.
          persist-credentials: false

      # Each push is a beta (a GitHub pre-release, which only copies with
      # Beta updates on are offered) unless its newest commit's message has
      # [stable] in it, or the workflow is run by hand as stable.
      - name: Pick the channel
        id: channel
        env:
          INPUT: ${{ inputs.channel }}
        run: |
          if [ "$INPUT" = stable ] || git log -1 --format=%B | grep -qF '[stable]'; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "A stable release"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "A beta (pre-release)"
          fi

      - name: Read the version
        id: version
        run: |
          base=$(node -p 'require("./desktop/package.json").version')
          if ! [[ $base =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            echo "::error::desktop/package.json has no version like 1.0.0 (it says '$base')"
            exit 1
          fi
          # The commits since the one movikoVersionBase counts (2.0.0's).
          from=$(node -p 'require("./desktop/package.json").movikoVersionBase || 0')
          patch=$(( $(git rev-list --count HEAD) - from ))
          if (( patch < 0 )); then
            echo "::error::This commit is before movikoVersionBase ($from) in desktop/package.json"
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$patch"
          {
            echo "version=$version"
            echo "tag=macos-v$version"
            echo "dmg=Moviko-$version-macos-universal.dmg"
            echo "zip=Moviko-$version-macos-universal.zip"
          } >> "$GITHUB_OUTPUT"
          echo "Building Moviko $version for macOS"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Same as the Makefile's "embed" target.
      - name: Embed the web UI into the server
        run: |
          dist=server/internal/webui/dist
          rm -rf "$dist"
          mkdir -p "$dist"
          cp -R web/dist/. "$dist/"
          touch "$dist/.keep"

      # The stream tests need ffmpeg and skip themselves without it, so a
      # failed install doesn't stop the build.
      - name: Install ffmpeg for the tests
        continue-on-error: true
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v ffmpeg || brew install ffmpeg
          ffmpeg -hide_banner -version | head -1

      # The setup that installs the programs Moviko uses runs on users' Macs,
      # in Terminal (Settings > App > Programs): check that it parses in the
      # bash macOS has, then run it here like a user would (without
      # Homebrew) and check that what it downloaded runs. A failure only
      # warns: it may be a download site's, and shouldn't hold back the app.
      # The setup-intel job does the same on an Intel Mac.
      - name: Check the programs setup script
        run: |
          /bin/bash --version | head -1
          /bin/bash -n server/internal/macsetup/install-tools.command

      - name: Run the programs setup
        continue-on-error: true
        timeout-minutes: 15
        run: .github/scripts/check-mac-setup.sh

      - name: go vet
        working-directory: server
        run: go vet ./...

      # A hang fails after 8 minutes with every goroutine's stack, instead of
      # Go's default 10.
      - name: go test
        working-directory: server
        run: go test -count 1 -timeout 8m ./...

      # The version and the commit go into the server (config.AppVersion and
      # config.Commit): the updater compares them with the newest release's.
      - name: Build the servers (Apple silicon and Intel)
        working-directory: server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist/macos
          config=github.com/v0-0x/kumobox-movies/server/internal/config
          for arch in arm64 amd64; do
            out=../dist/macos/moviko-$arch
            [ "$arch" = amd64 ] && out=../dist/macos/moviko-x64
            GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X $config.AppVersion=$VERSION -X $config.Commit=$GITHUB_SHA" -o "$out" ./cmd/moviko
          done
          file ../dist/macos/moviko-*
          reported=$(../dist/macos/moviko-arm64 --version)
          echo "moviko-arm64 --version: $reported"
          if [ "$reported" != "Moviko $VERSION" ]; then
            echo "::error::moviko-arm64 says '$reported' instead of 'Moviko $VERSION': the version didn't make it into the build."
            exit 1
          fi
          # The Intel server runs through Rosetta, when the runner has it.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "moviko-x64 --version: $(arch -x86_64 ../dist/macos/moviko-x64 --version)"
          fi

      # electron-builder names the files and versions the app after
      # desktop/package.json: it gets this build's version, on the runner
      # only (nothing is committed).
      - name: Package the desktop app (disk image and zip)
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --mac --universal --publish never -c.directories.output=../dist/macos/release

      - name: Check the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.version.outputs.dmg }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          app=dist/macos/release/mac-universal/Moviko.app
          ls -la dist/macos/release
          test -f "dist/macos/release/$DMG"
          test -f "dist/macos/release/$ZIP"
          for exe in "$app/Contents/MacOS/Moviko" "$app/Contents/Resources/moviko"; do
            archs=$(lipo -archs "$exe")
            echo "$exe: $archs"
            if [[ $archs != *x86_64* || $archs != *arm64* ]]; then
              echo "::error::$exe isn't universal ($archs)"
              exit 1
            fi
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist"

      # An update unpacks the zip with Moviko's own code: it must give back an
      # app whose signature holds and whose server runs.
      - name: Check the zip the way an update unpacks it
        working-directory: server
        env:
          MOVIKO_MAC_APP_ZIP: ${{ github.workspace }}/dist/macos/release/${{ steps.version.outputs.zip }}
          MOVIKO_MAC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: go test -count 1 -run TestReleasedMacApp -v ./internal/update

      # Opens the app like a user would and waits for its server to answer,
      # then quits it. The screenshot shows the window.
      - name: Start the app
        timeout-minutes: 5
        run: |
          app="$PWD/dist/macos/release/mac-universal/Moviko.app"
          export MOVIKO_DATA_DIR="$RUNNER_TEMP/moviko-data"
          "$app/Contents/MacOS/Moviko" > "$RUNNER_TEMP/moviko-app.log" 2>&1 &
          pid=$!
          info="${TMPDIR%/}/moviko/server.json"
          port=""
          for i in $(seq 1 90); do
            if [ -f "$info" ]; then
              port=$(node -p "require('$info').port" 2>/dev/null || true)
              if [ -n "$port" ] && curl -s -o /dev/null "http://127.0.0.1:$port/api/status"; then break; fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::Moviko quit on its own"
              cat "$RUNNER_TEMP/moviko-app.log"
              exit 1
            fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$port/api/status" || true)
          echo "The server answers on port $port with HTTP $code"
          sleep 8 # the window loads the UI
          screencapture -x "$RUNNER_TEMP/moviko-window.png" || echo "no screenshot"
          kill "$pid" || true
          for i in $(seq 1 15); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          echo "--- app log"
          cat "$RUNNER_TEMP/moviko-app.log"
          if [ -z "$port" ] || [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::Moviko's server didn't answer"
            exit 1
          fi

      - name: Upload the screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: macos-window
          path: ${{ runner.temp }}/moviko-window.png
          if-no-files-found: ignore

      # archive: false uploads the files as they are (no zip around them),
      # named after the file: the run's Summary page lists them for download,
      # on every branch.
      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          path: dist/macos/release/${{ steps.version.outputs.dmg }}
          archive: false
          overwrite: true
          if-no-files-found: error

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/macos/release/${{ steps.version.outputs.zip }}
          archive: false
          overwrite: true
          if-no-files-found: error

      # Creates the release (and its tag, on this commit, when it doesn't
      # exist yet), or updates it: new title and notes, and files of the same
      # name replaced. It isn't marked as the repository's latest release,
      # which stays the Windows one.
      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.version.outputs.dmg }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          **Moviko $VERSION for macOS 13 Ventura or newer, on Apple silicon and Intel Macs** (one app for both), the app for your movies and TV shows. On Windows and Arch Linux, see [the README]($repo/blob/$GITHUB_SHA/README.md).

          | File | What it is |
          |---|---|
          | \`$DMG\` | **Disk image** (recommended). Open it and drag Moviko to Applications. |
          | \`$ZIP\` | The same app in a zip (Moviko's updates download it). |

          Moviko isn't notarized by Apple, so the first time macOS says it can't check it: open Moviko once, then go to **System Settings › Privacy & Security** and click **Open Anyway** (on macOS 14 and older, Control-click Moviko in Applications and choose **Open**). Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Moviko.app\`

          Moviko finds newer releases by itself and updates from its Home page (**Update**), once it's in your Applications folder.

          Movie and show details come from TMDB: the first time, Moviko asks for your free TMDB API key. Letterboxd tracking only needs your Letterboxd username.

          Some features use other programs: ffmpeg (needed by the in-app player for most files), yt-dlp (stream downloads) and mpv (the external player); for torrents, qBittorrent or Transmission (optional). Moviko downloads ffmpeg and yt-dlp for your Mac from **Settings › App › Programs**, with no Homebrew or password needed (and installs mpv with Homebrew on Apple silicon); see [packaging/macos/README.md]($repo/blob/$GITHUB_SHA/packaging/macos/README.md).

          Built from $GITHUB_SHA by [workflow run $GITHUB_RUN_NUMBER]($repo/actions/runs/$GITHUB_RUN_ID).
          EOF
          if [ "$CHANNEL" = beta ]; then
            pre=true title="Moviko $VERSION beta for macOS"
            { printf '%s\n\n' "> **Beta.** This version is a pre-release: Moviko offers it only to copies with **Settings › Updates & about › Beta updates** on. It may have rough edges; the stable releases are the ones without this note."; cat "$notes"; } > "$notes.new" && mv "$notes.new" "$notes"
          else
            pre=false title="Moviko $VERSION for macOS"
          fi
          # Moviko was called KumoBox before 2.0.9: KumoBox's updater (2.0.8 and
          # older) looks for the zip by its old name, so a copy has it (the
          # app in it has what that updater checks: Contents/Resources/kumobox).
          cp "dist/macos/release/$ZIP" "dist/macos/release/KumoBox-$VERSION-macos-universal.zip"
          files=("dist/macos/release/$DMG" "dist/macos/release/$ZIP" "dist/macos/release/KumoBox-$VERSION-macos-universal.zip")
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "Updating the release $TAG"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$pre" --latest=false
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Creating the release $TAG"
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --prerelease="$pre" --latest=false
          fi

      # Keep the newest 10 stable macOS releases and the newest 10 betas,
      # by version (numbers compared as numbers), and delete the older ones
      # with their tags: betas never push out the stable releases.
      - name: Delete old releases
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          list=$(gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | "\(.isPrerelease) \(.tagName)"')
          old=$(for pre in true false; do
            printf '%s\n' "$list" | awk -v pre="$pre" '$1 == pre { print $2 }' |
              { grep -E '^macos-v[0-9]+(\.[0-9]+)*$' || true; } | sort -V -r | tail -n +11
          done)
          if [ -z "$old" ]; then
            echo "No old releases to delete"
            exit 0
          fi
          for tag in $old; do
            echo "Deleting the release $tag and its tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

  # The programs setup on an Intel Mac: the downloads are for each kind of
  # Mac. It doesn't hold back the release either.
  setup-intel:
    name: Programs setup (macOS Intel)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15-intel
    timeout-minutes: 20
    # It releases nothing.
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the programs setup script
        run: /bin/bash -n server/internal/macsetup/install-tools.command

      - name: Run the programs setup
        run: .github/scripts/check-mac-setup.sh
