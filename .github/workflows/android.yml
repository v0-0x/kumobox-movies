# Builds KumoBox for Android (made for TVs: a Fire TV Stick, mainly for the
# libraries the computers at home share) and publishes the APK as the GitHub
# Release "KumoBox <version> for Android", tagged android-v<version> on the
# commit it built.
#
# The app (android/) runs KumoBox's server, built here for Android with the NDK
# (32-bit ARM, which most Fire TV sticks run, and 64-bit), and shows its web
# UI. The version is 2.0.<commits since 2.0.0's>, like the other releases'
# (its version code is the number of commits, always higher):
# installed copies look for the android-v release with the highest version
# and update from their Home page (server/internal/update).
#
# The APK is signed with KumoBox's key, in the repository's secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (packaging/android/new-signing-key.sh makes it and puts
# it there). Without the secrets it's signed with a throwaway key, kept as a
# workflow artifact to try, and nothing is published.
#
# Runs on every push to the repository's default branch (except pushes that
# only change docs or another system's packaging), and by hand from the
# Actions tab. Each one is a beta (a pre-release) unless the pushed commit's
# message says [stable] or it's run by hand as stable (see windows.yml). The
# newest 10 stable releases and the newest 10 betas are kept.

name: Android release

on:
  # Pushes to other branches are skipped (see the job's condition).
  push:
    paths-ignore:
      - "**.md"
      - "desktop/**"
      - "packaging/arch/**"
      - "packaging/macos/**"
      - "packaging/windows/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the GitHub Release android-v<version> (otherwise it's only kept as a workflow artifact)
        type: boolean
        default: true
      channel:
        description: "beta: a pre-release, offered to copies with Beta updates on; stable: a release for everyone"
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and package (Android)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The whole history: the version counts its commits.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The token stays out of .git/config, where the build's
          # dependencies (npm scripts…) could read it: only the release
          # steps get it.
          persist-credentials: false

      # Each push is a beta (a GitHub pre-release, which only copies with
      # Beta updates on are offered) unless its newest commit's message has
      # [stable] in it, or the workflow is run by hand as stable.
      - name: Pick the channel
        id: channel
        env:
          INPUT: ${{ inputs.channel }}
        run: |
          if [ "$INPUT" = stable ] || git log -1 --format=%B | grep -qF '[stable]'; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "A stable release"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "A beta (pre-release)"
          fi

      - name: Read the version
        id: version
        run: |
          base=$(node -p 'require("./desktop/package.json").version')
          if ! [[ $base =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            echo "::error::desktop/package.json has no version like 1.0.0 (it says '$base')"
            exit 1
          fi
          count=$(git rev-list --count HEAD)
          # The commits since the one kumoboxVersionBase counts (2.0.0's); the
          # app's code stays the count, always higher than the last one.
          from=$(node -p 'require("./desktop/package.json").kumoboxVersionBase || 0')
          patch=$(( count - from ))
          if (( patch < 0 )); then
            echo "::error::This commit is before kumoboxVersionBase ($from) in desktop/package.json"
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$patch"
          {
            echo "version=$version"
            echo "code=$count"
            echo "tag=android-v$version"
            echo "apk=KumoBox-$version-android.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Building KumoBox $version for Android"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Same as the Makefile's "embed" target.
      - name: Embed the web UI into the server
        run: |
          dist=server/internal/webui/dist
          rm -rf "$dist"
          mkdir -p "$dist"
          cp -R web/dist/. "$dist/"
          touch "$dist/.keep"

      # With the NDK (cgo): Go needs it for 32-bit ARM, and it makes the
      # server use Android's own DNS and SQLite built with Android's C
      # library (see server/internal/db/driver_android.go). The app ships it
      # as its "native library" libkumobox.so, for each kind of device.
      - name: Build the server for Android
        working-directory: server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Go 1.26.0 tried 64-bit time system calls first on 32-bit ARM,
          # which Android 8 to 10 (a Fire TV's Android 9) kills a program
          # for, before it prints anything. The toolchain in go.mod
          # (1.26.9) checks the kernel instead (golang.org/issue/77621).
          go version
          if ! grep -q configure64bitsTimeOn32BitsArchitectures "$(go env GOROOT)/src/runtime/os_linux32.go"; then
            echo "::error::$(go version) makes system calls Android 8-10 forbids on 32-bit ARM; build with Go 1.26.9 or newer (server/go.mod)"
            exit 1
          fi
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ ! -d "$ndk" ]; then
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "NDK: $ndk"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          config=github.com/v0-0x/kumobox-movies/server/internal/config
          libs=../android/app/src/main/jniLibs
          build() {
            local abi=$1 goarch=$2 cc=$3 goarm=${4:-}
            mkdir -p "$libs/$abi"
            CGO_ENABLED=1 GOOS=android GOARCH=$goarch GOARM=$goarm CC="$tc/$cc" \
              go build -trimpath -ldflags "-s -w -X $config.AppVersion=$VERSION -X $config.Commit=$GITHUB_SHA" -o "$libs/$abi/libkumobox.so" ./cmd/kumobox
          }
          build armeabi-v7a arm armv7a-linux-androideabi21-clang 7
          build arm64-v8a arm64 aarch64-linux-android21-clang
          file "$libs"/*/libkumobox.so
          ls -la "$libs"/*/

      - name: Set up Gradle and the Android SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      # KumoBox's key from the secrets; without them, a throwaway key made
      # here (like KumoBox's): the build can be tried, not published.
      - name: Prepare the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/kumobox-release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            {
              echo "KUMOBOX_KEYSTORE=$ks"
              echo "KUMOBOX_KEYSTORE_PASSWORD=$STORE_PASS"
              echo "KUMOBOX_KEY_ALIAS=${KEY_ALIAS:-kumobox}"
              echo "KUMOBOX_KEY_PASSWORD=${KEY_PASS:-$STORE_PASS}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            XDG_DATA_HOME="$RUNNER_TEMP/throwaway" KUMOBOX_NO_GH=1 bash packaging/android/new-signing-key.sh > /dev/null
            tk="$RUNNER_TEMP/throwaway/kumobox-android-key"
            pass=$(cat "$tk/password")
            echo "::add-mask::$pass"
            {
              echo "KUMOBOX_KEYSTORE=$tk/kumobox-release.p12"
              echo "KUMOBOX_KEYSTORE_PASSWORD=$pass"
              echo "KUMOBOX_KEY_ALIAS=kumobox"
              echo "KUMOBOX_KEY_PASSWORD=$pass"
            } >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KumoBox's Android key isn't in the repository's secrets (packaging/android/new-signing-key.sh puts it there): this APK is signed with a throwaway key, kept as a workflow artifact, and not published."
          fi

      # Signed with the key above (build.gradle).
      - name: Build the APK
        env:
          KUMOBOX_VERSION: ${{ steps.version.outputs.version }}
          KUMOBOX_VERSION_CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          gradle --no-daemon -p android assembleRelease
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/$APK"

      # The server must be in it, stored so that Android extracts it, and
      # the APK signed.
      - name: Check the APK
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          apk="dist/android/$APK"
          unzip -lv "$apk" | grep -E "lib/(armeabi-v7a|arm64-v8a)/libkumobox.so"
          for abi in armeabi-v7a arm64-v8a; do
            unzip -lv "$apk" "lib/$abi/libkumobox.so" | grep -q " Defl:N \| Stored " || { echo "::error::lib/$abi/libkumobox.so is missing"; exit 1; }
          done
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk"
          "$bt/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|leanback|native-code|application-label)"
          ls -la "$apk"

      - name: Upload the APK (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          path: dist/android/${{ steps.version.outputs.apk }}
          archive: false
          overwrite: true
          if-no-files-found: error

      # Creates the release (and its tag, on this commit, when it doesn't
      # exist yet), or updates it. It isn't marked as the repository's latest
      # release, which stays the Windows one.
      - name: Publish the GitHub Release
        if: steps.key.outputs.signed == 'true' && (github.event_name == 'push' || inputs.publish)
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          url="$repo/releases/download/$TAG/$APK"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          **KumoBox $VERSION for Android**, made for TVs (Fire TV Stick, Android TV) and working on phones and tablets too: it plays the libraries the computers at home share, driven by the remote.

          **On a Fire TV:** install the **Downloader** app, allow it in **Settings › My Fire TV › Developer options › Install unknown apps**, and open this address in it:

          \`$url\`

          Then open KumoBox, and on a computer with KumoBox turn on **Settings › Other devices**: the TV shows up there. Turn on **Share my library** for it, and if you like **Let it download here** (its downloads and torrents go to that computer).

          KumoBox finds newer releases by itself and updates from its Home page (**Update**); Android asks before installing.

          Built from $GITHUB_SHA by [workflow run $GITHUB_RUN_NUMBER]($repo/actions/runs/$GITHUB_RUN_ID).
          EOF
          if [ "$CHANNEL" = beta ]; then
            pre=true title="KumoBox $VERSION beta for Android"
            { printf '%s\n\n' "> **Beta.** This version is a pre-release: KumoBox offers it only to copies with **Settings › Updates & about › Beta updates** on. It may have rough edges; the stable releases are the ones without this note."; cat "$notes"; } > "$notes.new" && mv "$notes.new" "$notes"
          else
            pre=false title="KumoBox $VERSION for Android"
          fi
          files=("dist/android/$APK")
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "Updating the release $TAG"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$pre" --latest=false
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Creating the release $TAG"
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --prerelease="$pre" --latest=false
          fi

      # Keep the newest 10 stable Android releases and the newest 10 betas,
      # by version (numbers compared as numbers), and delete the older ones
      # with their tags: betas never push out the stable releases.
      - name: Delete old releases
        if: steps.key.outputs.signed == 'true' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          list=$(gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | "\(.isPrerelease) \(.tagName)"')
          old=$(for pre in true false; do
            printf '%s\n' "$list" | awk -v pre="$pre" '$1 == pre { print $2 }' |
              { grep -E '^android-v[0-9]+(\.[0-9]+)*$' || true; } | sort -V -r | tail -n +11
          done)
          if [ -z "$old" ]; then
            echo "No old releases to delete"
            exit 0
          fi
          for tag in $old; do
            echo "Deleting the release $tag and its tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
