# Checks KumoBox on Linux, quickly, for every push to any branch and for pull
# requests: Go formatting, go vet (for Linux, and for Windows and macOS
# without their machines), the Go tests, and the web UI's build (which type
# checks it with tsc). The Windows and macOS workflows build, test and
# package on those systems; the Arch package is built from source with
# packaging/arch/PKGBUILD.

name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  # Pull requests from forks: a branch of this repository is checked by its
  # pushes already (see the job's condition).
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the check still going on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Go and web checks (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Lists the files gofmt would change, as errors on them.
      - name: gofmt
        working-directory: server
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            for f in $files; do echo "::error file=server/$f::not formatted with gofmt (run gofmt -w server/$f)"; done
            exit 1
          fi

      # npm run build type checks the UI (tsc) before bundling it.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Same as the Makefile's "embed" target: the server's tests see the UI
      # it ships with.
      - name: Embed the web UI into the server
        run: |
          dist=server/internal/webui/dist
          rm -rf "$dist"
          mkdir -p "$dist"
          cp -R web/dist/. "$dist/"
          touch "$dist/.keep"

      - name: go vet
        working-directory: server
        run: go vet ./...

      # The Windows and macOS code (build tags, *_windows.go, *_darwin.go)
      # gets vetted here too, before those systems' slower workflows.
      - name: go vet for Windows and macOS
        working-directory: server
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      # The stream tests need ffmpeg and skip themselves without it, so a
      # failed install doesn't stop the check.
      - name: Install ffmpeg for the tests
        continue-on-error: true
        timeout-minutes: 10
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ffmpeg -hide_banner -version | head -1

      # A hang fails after 8 minutes with every goroutine's stack, instead of
      # Go's default 10.
      - name: go test
        working-directory: server
        run: go test -count 1 -timeout 8m ./...
