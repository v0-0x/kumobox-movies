// Moviko for Android (a TV's, mainly). Built by .github/workflows/android.yml,
// which first builds Moviko's server for Android into src/main/jniLibs (see
// README.md here).
plugins {
    id 'com.android.application'
}

def env = { String name, String fallback -> System.getenv(name) ?: fallback }

android {
    // Android takes an update only for the same id, and TV launchers keep
    // the app's place by it: never changed.
    namespace 'app.kumobox'
    compileSdk 35

    defaultConfig {
        applicationId 'app.kumobox'
        minSdk 22
        targetSdk 34
        // 2.0.<commits since 2.0.0's>, like the other releases; the number
        // of commits is the version code.
        versionName env('MOVIKO_VERSION', '1.0.0')
        versionCode env('MOVIKO_VERSION_CODE', '1') as int
    }

    // Moviko's key (MOVIKO_KEYSTORE and its passwords, see README.md), or
    // else the debug key: a build of your own, for your own devices.
    signingConfigs {
        release {
            if (System.getenv('MOVIKO_KEYSTORE')) {
                storeFile file(System.getenv('MOVIKO_KEYSTORE'))
                storePassword env('MOVIKO_KEYSTORE_PASSWORD', '')
                keyAlias env('MOVIKO_KEY_ALIAS', 'kumobox')
                keyPassword env('MOVIKO_KEY_PASSWORD', env('MOVIKO_KEYSTORE_PASSWORD', ''))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('MOVIKO_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The server is a program, not a library: Android extracts it
    // (somewhere it may run it) only when it's stored this way.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
