# electron-builder config for the WINDOWS and MACOS releases:
#   - Windows: the installer and the portable zip, built by
#     packaging/windows/build.ps1 and the "Windows release" workflow
#     (.github/workflows/windows.yml), in ../dist/windows/release.
#   - macOS: one universal app for Apple silicon and Intel Macs, as a disk
#     image and a zip (which the app's updates download), built by the
#     "macOS release" workflow (.github/workflows/macos.yml), which puts them
#     in ../dist/macos/release (-c.directories.output).
# The Arch Linux package doesn't use it: packaging/arch/PKGBUILD installs
# main.js, preload.js and package.json for the system electron.
#
# Build the server first: dist/windows/moviko.exe ships as resources\moviko.exe,
# dist/macos/moviko-x64 and moviko-arm64 as Moviko.app/Contents/Resources/moviko
# (merged into one program that runs on both), where main.js looks for it.

appId: app.kumobox.desktop # also the AppUserModelID set in main.js
productName: Moviko
# Publisher shown in the exe's details and in Settings > Apps (otherwise the
# exe keeps Electron's "GitHub, Inc.").
extraMetadata:
  author:
    name: Moviko
publish: null # the workflows upload the releases; Moviko updates itself
npmRebuild: false # no native modules

# Electron fuses, flipped into the packaged binary before signing. Moviko is
# a plain GUI app (it never runs as Node, never reads NODE_OPTIONS and never
# takes --inspect), so these only close ways to turn its own binary into an
# arbitrary-code runner — e.g. a shortcut or another process relaunching it
# with ELECTRON_RUN_AS_NODE. onlyLoadAppFromAsar stops it loading a swapped-in
# app folder beside the asar, and enableEmbeddedAsarIntegrityValidation a
# modified asar: electron-builder writes the asar's hash into the app (the
# exe's resources on Windows, Info.plist on macOS), and Electron refuses to
# start when they don't match. The workflows start the packaged app to check
# it (main.js --smoke on Windows, the "Start the app" step on macOS).
# resetAdHocDarwinSignature re-applies the ad hoc macOS signature after the
# fuses change the binary (see the mac block).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  resetAdHocDarwinSignature: true

directories:
  output: ../dist/windows/release

files:
  - main.js
  - preload.js
  - icon.png
  - package.json

beforePack: ./check-server.js # fails the build when the server is missing

win:
  icon: icon.png
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # The portable zip's name (the installer's is set below).
  artifactName: Moviko-${version}-windows-${arch}-portable.${ext}
  extraResources:
    - from: ../dist/windows/moviko.exe
      to: moviko.exe
    # The setup that installs the programs Moviko uses (ffmpeg, mpv, yt-dlp,
    # with Scoop): the installer offers to run it (installer.nsh), and
    # moviko.exe has the same script built in for Settings > Desktop app & programs.
    - from: ../server/internal/winsetup/install-tools.ps1
      to: install-tools.ps1

nsis:
  artifactName: Moviko-Setup-${version}-windows-${arch}.${ext}
  oneClick: false
  perMachine: false
  # Always installs for the current user (no admin rights, no "for all
  # users?" page).
  include: ../packaging/windows/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Moviko
  differentialPackage: false # no auto-update, so no .blockmap

mac:
  # macOS app icons leave a margin around the tile (Apple's icon grid).
  icon: ../packaging/macos/icon.png
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: Moviko-${version}-macos-${arch}.${ext}
  # Packed once for each architecture with its own server (${arch} is x64,
  # then arm64), which the universal app merges into one program.
  extraResources:
    - from: ../dist/macos/moviko-${arch}
      to: moviko
    # KumoBox's updater (2.0.8 and older; Moviko's old name) takes a new app
    # only with its server at Contents/Resources/kumobox: a stand-in there.
    - from: ../packaging/macos/kumobox
      to: kumobox
  # Moviko isn't signed with an Apple Developer ID: it's signed ad hoc ("-"),
  # which Apple silicon Macs need to run it at all. The hardened runtime is
  # for notarized apps; with an ad hoc signature it would stop the app from
  # loading its own frameworks.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # Shown when Moviko first reaches a device on the network (a torrent
    # client, a Chromecast…).
    NSLocalNetworkUsageDescription: Moviko connects to devices on your network, like your torrent client or other computers running Moviko.

dmg:
  # The window: Moviko on the left, the Applications folder on the right.
  title: Moviko ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
